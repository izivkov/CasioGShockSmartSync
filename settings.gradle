pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}
rootProject.name = "Casio GShock Smart Sync"
include ':app'

// The plugin interface and the plugins come from ExcuseMi/smartsync-plugins through JitPack (gradle/libs.versions.toml).
// For fast work on both: -PsmartsyncPluginsDir=../smartsync-plugins (or that line in ~/.gradle/gradle.properties)
// builds them from that checkout instead.
def smartsyncPluginsDir = providers.gradleProperty('smartsyncPluginsDir').orNull
if (smartsyncPluginsDir != null) {
    if (!file("$smartsyncPluginsDir/plugin-api/build.gradle").exists()) {
        throw new GradleException("smartsyncPluginsDir=$smartsyncPluginsDir is not a checkout of smartsync-plugins")
    }
    includeBuild(smartsyncPluginsDir) {
        dependencySubstitution {
            ['plugin-api', 'homeassistant', 'healthconnect', 'trmnl'].each { m ->
                substitute module("com.github.ExcuseMi.smartsync-plugins:$m") using project(":$m")
            }
        }
    }
}

// The GShockAPI library is the ExcuseMi/GShockAPI fork (branch smartsync), checked out as the
// gshockapi submodule and built with the app, so a library change needs no JitPack release.
if (!file('gshockapi/api/build.gradle').exists()) {
    throw new GradleException("The gshockapi submodule is missing: run 'git submodule update --init'")
}
includeBuild('gshockapi') {
    dependencySubstitution {
        substitute module('com.github.izivkov:GShockAPI') using project(':api')
    }
}
