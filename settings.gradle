pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}
rootProject.name = "Casio GShock Smart Sync"
// JitPack (tag plugin-api-v<version>) builds the plugin interface alone: no app, no library submodule.
def jitpack = System.getenv("JITPACK") == "true"
// The plugin interface, versioned on its own (plugin-api/build.gradle) and published through JitPack.
include ':plugin-api'
if (!jitpack) {
    include ':app'
    // The Home Assistant plugin, on the plugin interface only (moves to its own repository next).
    include ':plugins:homeassistant'

    // The GShockAPI library is the ExcuseMi/GShockAPI fork (branch smartsync), checked out as the
    // gshockapi submodule and built with the app, so a library change needs no JitPack release.
    if (!file('gshockapi/api/build.gradle').exists()) {
        throw new GradleException("The gshockapi submodule is missing: run 'git submodule update --init'")
    }
    includeBuild('gshockapi') {
        dependencySubstitution {
            substitute module('com.github.izivkov:GShockAPI') using project(':api')
        }
    }
}
