// Remote flavor settings come from the repo-root .env (gitignored), overridable with -P properties.
def remoteEnv = new Properties()
def remoteEnvFile = rootProject.file(".env")
if (remoteEnvFile.exists()) { remoteEnvFile.withInputStream { remoteEnv.load(it) } }
def envValue = { String key, String fallback -> (project.findProperty(key) ?: remoteEnv.getProperty(key) ?: fallback).toString() }

android {
    namespace = 'org.avmedia.gshockGoogleSync'
    compileSdk = 37

    flavorDimensions "distribution"
    productFlavors {
        github {
            dimension "distribution"
            buildConfigField "boolean", "REMOTE_MODE", "false"
            buildConfigField "String", "BRIDGE_HOST", "\"\""
            buildConfigField "int", "BRIDGE_PORT", "0"
        }
        playStore {
            dimension "distribution"
            buildConfigField "boolean", "REMOTE_MODE", "false"
            buildConfigField "String", "BRIDGE_HOST", "\"\""
            buildConfigField "int", "BRIDGE_PORT", "0"
        }
        remote {
            dimension "distribution"
            buildConfigField "boolean", "REMOTE_MODE", "true"
            // BRIDGE_URL (e.g. wss://gshock-remote.avmedia.org) takes precedence over host and port.
            buildConfigField "String", "BRIDGE_URL", "\"" + envValue("BRIDGE_URL", "") + "\""
            buildConfigField "String", "BRIDGE_HOST", "\"" + envValue("bridgeHost", "127.0.0.1") + "\""
            buildConfigField "int", "BRIDGE_PORT", envValue("bridgePort", "9999")
            buildConfigField "String", "CF_ACCESS_CLIENT_ID", "\"" + envValue("CF_ACCESS_CLIENT_ID", "") + "\""
            buildConfigField "String", "CF_ACCESS_CLIENT_SECRET", "\"" + envValue("CF_ACCESS_CLIENT_SECRET", "") + "\""
        }
    }

    sourceSets {
        github {
            java.srcDirs = ['src/local/java']
        }
        playStore {
            java.srcDirs = ['src/local/java']
        }
        remote {
            java.srcDirs = ['src/remote/java']
        }
    }

    defaultConfig {
        applicationId = "org.avmedia.gshockGoogleSync"
        minSdk = 26
        targetSdk = 37
        versionCode = 42912
        versionName = "42.9.12"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            // These environment variables will be set in GitHub Actions
            def ksPath = System.getenv("KEYSTORE_PATH") ?: "release.keystore"
            def ksFile = file(ksPath)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            optimization {
                enable = true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        disable 'TypographyFractions', 'TypographyQuotes'
    }
}

